[package]
name = "rustyboi-core"
version = "0.1.0"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rustyboi_core_lib"
crate-type = ["rlib"]

[features]
# CLI-argument support: derives `clap::ValueEnum` on the machine-identity enums
# (`gb::Hardware`, `gb::Region`) so a CLI can parse them directly. Off by
# default — the wasm, libretro, Android and session consumers embed the core and
# would otherwise pull the whole clap parser and its proc-macros.
cli = ["dep:clap"]

# Release-safe audit of the band-limited synth's fold/drain invariants: upgrades
# the `debug_assert!`-guarded "pending drained before every cc fold" tripwires to
# always-run panics. Needed because the suite gates and the library baseline
# regen run RELEASE, where `debug_assert!` is compiled out; WP5 runs one
# >9-emulated-minute audited sweep crossing the 0x6000_0000 epoch fold.
synth-audit = []

[dependencies]
clap = { workspace = true, optional = true }
rustyboi-mix = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_bytes = "=0.11.19"
libm = { workspace = true }
bincode = { workspace = true }
zip = { workspace = true, features = ["deflate64", "lzma"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "=1.1.0"

# The `Hardware` analog-stage coverage test enumerates the enum through
# `ValueEnum::value_variants`, which is exhaustive by construction (a hand-kept
# list is not). Unit tests therefore always get the derive; see the `cfg_attr`
# in `gb.rs`. Test-only, so it costs the embedding consumers nothing.
[dev-dependencies]
clap = { workspace = true }
